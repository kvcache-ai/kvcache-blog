<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Mooncake structured-object transfer architecture</title>
  <desc id="desc">Architecture diagram showing framework API, PUT path, manifest, store data plane, GET path, and cleanup for structured rollout objects.</desc>
  <defs>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b7a"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a6d"/>
    </marker>
    <marker id="arrow-ray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c38"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#22313f" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .h { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .tiny { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .value { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .card { fill: #ffffff; stroke: #cfd7dc; stroke-width: 1.2; rx: 8; filter: url(#soft-shadow); }
      .soft { fill: #f0f2f1; stroke: #cfd7dc; stroke-width: 1.1; rx: 8; }
      .moon { fill: #e4f3ee; stroke: #187a6d; stroke-width: 1.3; rx: 8; }
      .ray { fill: #f8e8df; stroke: #b85c38; stroke-width: 1.3; rx: 8; }
      .amber { fill: #f9ecd8; stroke: #c47a28; stroke-width: 1.3; rx: 8; }
      .blue { fill: #e7eef6; stroke: #405f82; stroke-width: 1.3; rx: 8; }
      .control-arrow { fill: none; stroke: #5d6b7a; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow-control); }
      .data-arrow { fill: none; stroke: #187a6d; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrow-data); }
      .grid { stroke: #dfe5e8; stroke-width: 1; }
      .axis { stroke: #8996a3; stroke-width: 1.2; }
      .moon-line { fill: none; stroke: #187a6d; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .ray-line { fill: none; stroke: #b85c38; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
<text x="60.0" y="52.0" class="title" text-anchor="start">Mooncake structured-object transfer architecture</text>
<text x="60.0" y="80.0" class="subtitle" text-anchor="start">Schema selects the encoding path; the manifest records what was written for GET reconstruction.</text>
<rect x="60.0" y="115.0" width="1080.0" height="555.0" class="card"/>
<rect x="95.0" y="155.0" width="220.0" height="390.0" class="soft"/>
<text x="125.0" y="192.0" class="h" text-anchor="start">Framework boundary</text>
<text x="125.0" y="222.0" class="small" text-anchor="start">dict or DataProto</text>
<text x="125.0" y="250.0" class="small" text-anchor="start">type=&quot;dict&quot; / type=&quot;dataproto&quot;</text>
<text x="125.0" y="278.0" class="small" text-anchor="start">field schemas and options</text>
<rect x="125.0" y="345.0" width="145.0" height="48.0" class="blue"/>
<text x="198.0" y="375.0" class="label" text-anchor="middle">rollout ref</text>
<text x="125.0" y="460.0" class="small" text-anchor="start">The framework keeps</text>
<text x="125.0" y="484.0" class="small" text-anchor="start">scheduling semantics.</text>
<rect x="365.0" y="145.0" width="430.0" height="180.0" class="moon"/>
<text x="395.0" y="180.0" class="h" text-anchor="start">PUT path</text>
<circle cx="400.0" cy="211.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="215.0" class="small" text-anchor="start">expand object into typed leaves</text>
<circle cx="400.0" cy="237.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="241.0" class="small" text-anchor="start">apply field schema to choose the codec</text>
<circle cx="400.0" cy="263.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="267.0" class="small" text-anchor="start">pack small leaves into pooled registered buffers</text>
<circle cx="400.0" cy="289.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="293.0" class="small" text-anchor="start">write payloads, copy layout, and manifest</text>
<rect x="365.0" y="385.0" width="430.0" height="180.0" class="amber"/>
<text x="395.0" y="420.0" class="h" text-anchor="start">GET path</text>
<circle cx="400.0" cy="451.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="455.0" class="small" text-anchor="start">read manifest from the rollout ref</text>
<circle cx="400.0" cy="477.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="481.0" class="small" text-anchor="start">derive payload keys and optional field or row slices</text>
<circle cx="400.0" cy="503.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="507.0" class="small" text-anchor="start">fetch selected leaves from store</text>
<circle cx="400.0" cy="529.0" r="3.2" fill="#187a6d" opacity="0.75"/>
<text x="413.0" y="533.0" class="small" text-anchor="start">decode and reconstruct the original object shape</text>
<rect x="855.0" y="155.0" width="240.0" height="150.0" class="blue"/>
<text x="885.0" y="190.0" class="h" text-anchor="start">Schema + manifest</text>
<text x="885.0" y="220.0" class="small" text-anchor="start">schema: stable field meaning</text>
<text x="885.0" y="244.0" class="small" text-anchor="start">manifest: actual payloads</text>
<text x="885.0" y="272.0" class="small" text-anchor="start">dtype, shape, offsets, nulls</text>
<rect x="855.0" y="355.0" width="240.0" height="150.0" class="moon"/>
<text x="885.0" y="390.0" class="h" text-anchor="start">Store data plane</text>
<text x="885.0" y="420.0" class="small" text-anchor="start">payload keys and chunks</text>
<text x="885.0" y="444.0" class="small" text-anchor="start">BufferPool registered memory</text>
<text x="885.0" y="472.0" class="small" text-anchor="start">cleanup and buffer release</text>
<path d="M 315 230 C 335 230, 345 230, 365 230" class="data-arrow"/>
<path d="M 795 230 C 820 230, 830 230, 855 230" class="data-arrow"/>
<path d="M 855 430 C 830 430, 820 430, 795 430" class="data-arrow"/>
<path d="M 365 475 C 340 475, 330 475, 315 475" class="data-arrow"/>
<path d="M 580 325 C 580 350, 580 360, 580 385" class="control-arrow"/>
<text x="610.0" y="358.0" class="small" text-anchor="start">same manifest drives decode</text>
<path d="M 975 305 C 975 325, 975 335, 975 355" class="control-arrow"/>
<text x="1005.0" y="335.0" class="small" text-anchor="start">payload lookup</text>
<rect x="265.0" y="595.0" width="670.0" height="42.0" class="ray"/>
<text x="600.0" y="622.0" class="label" text-anchor="middle">The reference is small; the manifest and payloads remain owned by Mooncake until cleanup.</text>
</svg>
