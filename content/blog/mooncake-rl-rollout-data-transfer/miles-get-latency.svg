<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
  <title id="title">Miles GET latency by payload size</title>
  <desc id="desc">On a logarithmic latency scale, Mooncake GET is 10.6 to 14.1 times faster than Ray GET across 128 MiB to 4 GiB Miles rollout payloads.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .label { font: 600 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .small { font: 500 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6b7a; }
      .tick { font: 500 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .value { font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .moon { fill: #e4f3ee; stroke: #187a6d; stroke-width: 1.4; rx: 7; }
      .grid { stroke: #dfe5e8; stroke-width: 1.2; }
      .axis { stroke: #8996a3; stroke-width: 1.5; }
      .moon-line { fill: none; stroke: #187a6d; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
      .ray-line { fill: none; stroke: #b85c38; stroke-width: 4.5; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" width="760" height="650"/>

  <line x1="430" y1="38" x2="468" y2="38" class="moon-line"/>
  <circle cx="449" cy="38" r="7" fill="#187a6d"/>
  <text x="480" y="45" class="label">Mooncake GET</text>
  <line x1="430" y1="72" x2="468" y2="72" class="ray-line"/>
  <circle cx="449" cy="72" r="7" fill="#b85c38"/>
  <text x="480" y="79" class="label">Ray GET</text>

  <text x="27" y="325" class="small" text-anchor="middle" transform="rotate(-90 27 325)">GET latency · log scale</text>

  <line x1="105" y1="496" x2="715" y2="496" class="grid"/>
  <text x="92" y="502" class="tick" text-anchor="end">50ms</text>
  <line x1="105" y1="452" x2="715" y2="452" class="grid"/>
  <text x="92" y="458" class="tick" text-anchor="end">100ms</text>
  <line x1="105" y1="383" x2="715" y2="383" class="grid"/>
  <text x="92" y="389" class="tick" text-anchor="end">300ms</text>
  <line x1="105" y1="313" x2="715" y2="313" class="grid"/>
  <text x="92" y="319" class="tick" text-anchor="end">1s</text>
  <line x1="105" y1="237" x2="715" y2="237" class="grid"/>
  <text x="92" y="243" class="tick" text-anchor="end">3s</text>
  <line x1="105" y1="160" x2="715" y2="160" class="grid"/>
  <text x="92" y="166" class="tick" text-anchor="end">10s</text>
  <line x1="105" y1="90" x2="715" y2="90" class="grid"/>
  <text x="92" y="96" class="tick" text-anchor="end">30s</text>

  <line x1="105" y1="515" x2="715" y2="515" class="axis"/>
  <line x1="105" y1="90" x2="105" y2="515" class="axis"/>

  <path d="M160 350 L330 258 L500 204 L670 116" class="ray-line"/>
  <path d="M160 499 L330 417 L500 371 L670 283" class="moon-line"/>

  <circle cx="160" cy="350" r="8" fill="#b85c38"/>
  <text x="160" y="330" class="small" text-anchor="middle">501ms</text>
  <circle cx="330" cy="258" r="8" fill="#b85c38"/>
  <text x="330" y="238" class="small" text-anchor="middle">2.134s</text>
  <circle cx="500" cy="204" r="8" fill="#b85c38"/>
  <text x="500" y="184" class="small" text-anchor="middle">5.035s</text>
  <circle cx="670" cy="116" r="8" fill="#b85c38"/>
  <text x="670" y="99" class="small" text-anchor="middle">20.034s</text>

  <circle cx="160" cy="499" r="8" fill="#187a6d"/>
  <text x="160" y="541" class="small" text-anchor="middle">47ms</text>
  <rect x="119" y="454" width="82" height="34" class="moon"/>
  <text x="160" y="478" class="value" text-anchor="middle">10.6x</text>

  <circle cx="330" cy="417" r="8" fill="#187a6d"/>
  <text x="330" y="446" class="small" text-anchor="middle">173ms</text>
  <rect x="289" y="373" width="82" height="34" class="moon"/>
  <text x="330" y="397" class="value" text-anchor="middle">12.3x</text>

  <circle cx="500" cy="371" r="8" fill="#187a6d"/>
  <text x="500" y="400" class="small" text-anchor="middle">356ms</text>
  <rect x="459" y="327" width="82" height="34" class="moon"/>
  <text x="500" y="351" class="value" text-anchor="middle">14.1x</text>

  <circle cx="670" cy="283" r="8" fill="#187a6d"/>
  <text x="670" y="312" class="small" text-anchor="middle">1.426s</text>
  <rect x="629" y="239" width="82" height="34" class="moon"/>
  <text x="670" y="263" class="value" text-anchor="middle">14.1x</text>

  <line x1="160" y1="515" x2="160" y2="523" class="axis"/>
  <text x="160" y="590" class="small" text-anchor="middle">128 MiB</text>
  <line x1="330" y1="515" x2="330" y2="523" class="axis"/>
  <text x="330" y="590" class="small" text-anchor="middle">512 MiB</text>
  <line x1="500" y1="515" x2="500" y2="523" class="axis"/>
  <text x="500" y="590" class="small" text-anchor="middle">1 GiB</text>
  <line x1="670" y1="515" x2="670" y2="523" class="axis"/>
  <text x="670" y="590" class="small" text-anchor="middle">4 GiB</text>
</svg>
