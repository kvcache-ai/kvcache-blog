<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Miles GET latency by payload size</title>
  <desc id="desc">Line chart showing Mooncake GET latency is 10.6 to 14.1 times faster than Ray GET across 128 MiB to 4 GiB Miles rollout payloads.</desc>
  <defs>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b7a"/>
    </marker>
    <marker id="arrow-data" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187a6d"/>
    </marker>
    <marker id="arrow-ray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85c38"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#22313f" flood-opacity="0.10"/>
    </filter>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 600 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .h { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .label { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .small { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .tiny { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #667383; }
      .value { font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .card { fill: #ffffff; stroke: #cfd7dc; stroke-width: 1.2; rx: 8; filter: url(#soft-shadow); }
      .soft { fill: #f0f2f1; stroke: #cfd7dc; stroke-width: 1.1; rx: 8; }
      .moon { fill: #e4f3ee; stroke: #187a6d; stroke-width: 1.3; rx: 8; }
      .ray { fill: #f8e8df; stroke: #b85c38; stroke-width: 1.3; rx: 8; }
      .amber { fill: #f9ecd8; stroke: #c47a28; stroke-width: 1.3; rx: 8; }
      .blue { fill: #e7eef6; stroke: #405f82; stroke-width: 1.3; rx: 8; }
      .control-arrow { fill: none; stroke: #5d6b7a; stroke-width: 2; stroke-dasharray: 6 6; marker-end: url(#arrow-control); }
      .data-arrow { fill: none; stroke: #187a6d; stroke-width: 6; stroke-linecap: round; marker-end: url(#arrow-data); }
      .grid { stroke: #dfe5e8; stroke-width: 1; }
      .axis { stroke: #8996a3; stroke-width: 1.2; }
      .moon-line { fill: none; stroke: #187a6d; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .ray-line { fill: none; stroke: #b85c38; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
<text x="60.0" y="52.0" class="title" text-anchor="start">Miles GET latency by payload size</text>
<text x="60.0" y="80.0" class="subtitle" text-anchor="start">Cross-node GET latency, one warmup plus three measured trials. Lower is better.</text>
<line x1="120" y1="559.7" x2="1020" y2="559.7" class="grid"/>
<text x="102.0" y="563.7" class="tiny" text-anchor="end">50ms</text>
<line x1="120" y1="512.0" x2="1020" y2="512.0" class="grid"/>
<text x="102.0" y="516.0" class="tiny" text-anchor="end">100ms</text>
<line x1="120" y1="436.5" x2="1020" y2="436.5" class="grid"/>
<text x="102.0" y="440.5" class="tiny" text-anchor="end">300ms</text>
<line x1="120" y1="353.8" x2="1020" y2="353.8" class="grid"/>
<text x="102.0" y="357.8" class="tiny" text-anchor="end">1s</text>
<line x1="120" y1="278.3" x2="1020" y2="278.3" class="grid"/>
<text x="102.0" y="282.3" class="tiny" text-anchor="end">3s</text>
<line x1="120" y1="195.5" x2="1020" y2="195.5" class="grid"/>
<text x="102.0" y="199.5" class="tiny" text-anchor="end">10s</text>
<line x1="120" y1="120.0" x2="1020" y2="120.0" class="grid"/>
<text x="102.0" y="124.0" class="tiny" text-anchor="end">30s</text>
<line x1="120" y1="575" x2="1020" y2="575" class="axis"/>
<line x1="120" y1="120" x2="120" y2="575" class="axis"/>
<text x="58.0" y="350.0" class="label" text-anchor="middle">GET latency</text>
<text x="58" y="371" class="tiny" text-anchor="middle">log scale</text>
<line x1="200.0" y1="575" x2="200.0" y2="583" class="axis"/>
<text x="200.0" y="607.0" class="small" text-anchor="middle">128 MiB</text>
<line x1="446.7" y1="575" x2="446.7" y2="583" class="axis"/>
<text x="446.7" y="607.0" class="small" text-anchor="middle">512 MiB</text>
<line x1="693.3" y1="575" x2="693.3" y2="583" class="axis"/>
<text x="693.3" y="607.0" class="small" text-anchor="middle">1 GiB</text>
<line x1="940.0" y1="575" x2="940.0" y2="583" class="axis"/>
<text x="940.0" y="607.0" class="small" text-anchor="middle">4 GiB</text>
<path d="M 200.0 401.2 L 446.7 301.7 L 693.3 242.7 L 940.0 147.7" class="ray-line"/>
<path d="M 200.0 563.3 L 446.7 474.3 L 693.3 424.7 L 940.0 329.4" class="moon-line"/>
<circle cx="200.0" cy="401.2" r="7" fill="#b85c38"/>
<text x="200.0" y="385.2" class="small" text-anchor="middle">501ms</text>
<circle cx="446.7" cy="301.7" r="7" fill="#b85c38"/>
<text x="446.7" y="285.7" class="small" text-anchor="middle">2.1342s</text>
<circle cx="693.3" cy="242.7" r="7" fill="#b85c38"/>
<text x="693.3" y="226.7" class="small" text-anchor="middle">5.0354s</text>
<circle cx="940.0" cy="147.7" r="7" fill="#b85c38"/>
<text x="940.0" y="131.7" class="small" text-anchor="middle">20.0343s</text>
<circle cx="200.0" cy="563.3" r="7" fill="#187a6d"/>
<text x="200.0" y="589.3" class="small" text-anchor="middle">47ms</text>
<rect x="167.0" y="520.3" width="66.0" height="26.0" class="moon"/>
<text x="200.0" y="538.3" class="value" text-anchor="middle">10.6x</text>
<circle cx="446.7" cy="474.3" r="7" fill="#187a6d"/>
<text x="446.7" y="500.3" class="small" text-anchor="middle">173ms</text>
<rect x="413.7" y="431.3" width="66.0" height="26.0" class="moon"/>
<text x="446.7" y="449.3" class="value" text-anchor="middle">12.3x</text>
<circle cx="693.3" cy="424.7" r="7" fill="#187a6d"/>
<text x="693.3" y="450.7" class="small" text-anchor="middle">356ms</text>
<rect x="660.3" y="381.7" width="66.0" height="26.0" class="moon"/>
<text x="693.3" y="399.7" class="value" text-anchor="middle">14.1x</text>
<circle cx="940.0" cy="329.4" r="7" fill="#187a6d"/>
<text x="940.0" y="355.4" class="small" text-anchor="middle">1.4259s</text>
<rect x="907.0" y="286.4" width="66.0" height="26.0" class="moon"/>
<text x="940.0" y="304.4" class="value" text-anchor="middle">14.1x</text>
<line x1="835" y1="55" x2="880" y2="55" class="moon-line"/>
<circle cx="857" cy="55" r="6" fill="#187a6d"/>
<text x="892.0" y="60.0" class="small" text-anchor="start">Mooncake GET</text>
<line x1="835" y1="82" x2="880" y2="82" class="ray-line"/>
<circle cx="857" cy="82" r="6" fill="#b85c38"/>
<text x="892.0" y="87.0" class="small" text-anchor="start">Ray GET</text>
<rect x="1037.0" y="137.0" width="108.0" height="120.0" class="soft"/>
<text x="1091.0" y="167.0" class="h" text-anchor="middle">Result</text>
<text x="1091.0" y="197.0" class="value" text-anchor="middle">10.6x-14.1x</text>
<text x="1091.0" y="223.0" class="small" text-anchor="middle">faster GET</text>
</svg>
