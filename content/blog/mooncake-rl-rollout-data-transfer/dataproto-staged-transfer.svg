<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">DataProto incremental publication and partial reads</title>
  <desc id="desc">DataProto fields can be appended for existing rows, new row groups can be published as separate fragments, and readers can select fields and rows together.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#405f82"/>
    </marker>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6b7a; }
      .heading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .label { font: 650 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .field { font: 650 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #22313f; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5d6b7a; }
      .time { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #405f82; }
      .panel { fill: #fff; stroke: #cfd7dc; stroke-width: 1.6; }
      .neutral { fill: #f2f4f3; stroke: #cfd7dc; stroke-width: 1.3; }
      .base { fill: #e4f3ee; stroke: #187a6d; stroke-width: 1.5; }
      .added { fill: #f9ecd8; stroke: #c47a28; stroke-width: 1.5; }
      .index { fill: #e7eef6; stroke: #405f82; stroke-width: 1.5; }
      .selected { fill: none; stroke: #405f82; stroke-width: 3; }
      .flow { fill: none; stroke: #405f82; stroke-width: 2.5; marker-end: url(#arrow); }
      .divider { stroke: #dfe5e8; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="820"/>
  <text class="title" x="45" y="48">DataProto incremental publication and partial reads</text>
  <text class="subtitle" x="45" y="78">Fields and row groups may become ready at different times</text>

  <!-- Field append: same rows, new columns. -->
  <rect class="panel" x="40" y="105" width="550" height="285" rx="7"/>
  <text class="heading" x="65" y="140">1. Fields arrive later</text>
  <text class="body" x="65" y="166">append_dataproto_fields()</text>
  <text class="time" x="70" y="198">T0 - HANDLE H0</text>
  <rect class="panel" x="65" y="210" width="190" height="135" rx="6"/>
  <text class="body" x="78" y="264">row 0</text>
  <text class="body" x="78" y="316">row 1</text>
  <rect class="base" x="125" y="225" width="55" height="30" rx="4"/>
  <text class="field" x="152" y="245" text-anchor="middle">input</text>
  <rect class="base" x="188" y="225" width="55" height="30" rx="4"/>
  <text class="field" x="215" y="245" text-anchor="middle">response</text>
  <rect class="base" x="125" y="273" width="55" height="30" rx="4"/>
  <rect class="base" x="188" y="273" width="55" height="30" rx="4"/>
  <rect class="base" x="125" y="311" width="55" height="22" rx="4"/>
  <rect class="base" x="188" y="311" width="55" height="22" rx="4"/>

  <path class="flow" d="M255 278 H322"/>
  <text class="body" x="288" y="258" text-anchor="middle">append</text>

  <text class="time" x="335" y="198">T1 - HANDLE H1</text>
  <rect class="panel" x="330" y="210" width="235" height="135" rx="6"/>
  <text class="body" x="342" y="264">row 0</text>
  <text class="body" x="342" y="316">row 1</text>
  <rect class="base" x="389" y="225" width="46" height="30" rx="4"/>
  <text class="field" x="412" y="245" text-anchor="middle">input</text>
  <rect class="base" x="442" y="225" width="55" height="30" rx="4"/>
  <text class="field" x="469" y="245" text-anchor="middle">response</text>
  <rect class="added" x="504" y="225" width="49" height="30" rx="4"/>
  <text class="field" x="528" y="245" text-anchor="middle">logp</text>
  <rect class="base" x="389" y="273" width="46" height="30" rx="4"/>
  <rect class="base" x="442" y="273" width="55" height="30" rx="4"/>
  <rect class="added" x="504" y="273" width="49" height="30" rx="4"/>
  <rect class="base" x="389" y="311" width="46" height="22" rx="4"/>
  <rect class="base" x="442" y="311" width="55" height="22" rx="4"/>
  <rect class="added" x="504" y="311" width="49" height="22" rx="4"/>

  <!-- Row publication: separate fragments, one logical index. -->
  <rect class="panel" x="610" y="105" width="550" height="285" rx="7"/>
  <text class="heading" x="635" y="140">2. New rows arrive later</text>
  <text class="body" x="635" y="166">separate put() calls; no handle mutation</text>
  <text class="time" x="650" y="198">T0 - FRAGMENT F1</text>
  <rect class="base" x="640" y="210" width="200" height="76" rx="6"/>
  <text class="label" x="660" y="238">keys k0 / k1</text>
  <text class="body" x="660" y="267">input / response</text>

  <text class="time" x="940" y="198">T1 - FRAGMENT F2</text>
  <rect class="added" x="930" y="210" width="200" height="76" rx="6"/>
  <text class="label" x="950" y="238">keys k2 / k3</text>
  <text class="body" x="950" y="267">input / response</text>

  <path class="flow" d="M740 286 V310 H795 V326"/>
  <path class="flow" d="M1030 286 V310 H975 V326"/>
  <rect class="index" x="720" y="330" width="330" height="42" rx="6"/>
  <text class="label" x="885" y="356" text-anchor="middle">logical rows k0 / k1 / k2 / k3</text>

  <!-- Partial read: intersection of selected fields and rows. -->
  <rect class="panel" x="40" y="410" width="1120" height="365" rx="7"/>
  <text class="heading" x="65" y="448">3. Partial read</text>
  <text class="body" x="65" y="473">get(..., fields=..., rows=...)</text>

  <rect class="panel" x="75" y="492" width="500" height="238" rx="6"/>
  <text class="field" x="225" y="522" text-anchor="middle">input_ids</text>
  <text class="field" x="375" y="522" text-anchor="middle">responses</text>
  <text class="field" x="525" y="522" text-anchor="middle">old_log_probs</text>
  <line class="divider" x1="95" y1="532" x2="555" y2="532"/>
  <text class="body" x="95" y="562">row 0</text>
  <text class="body" x="95" y="607">row 1</text>
  <text class="body" x="95" y="652">row 2</text>
  <text class="body" x="95" y="697">row 3</text>
  <rect class="neutral" x="175" y="542" width="100" height="27" rx="4"/>
  <rect class="neutral" x="325" y="542" width="100" height="27" rx="4"/>
  <rect class="neutral" x="475" y="542" width="100" height="27" rx="4"/>
  <rect class="neutral" x="175" y="587" width="100" height="27" rx="4"/>
  <rect class="base" x="325" y="587" width="100" height="27" rx="4"/>
  <rect class="added" x="475" y="587" width="100" height="27" rx="4"/>
  <rect class="neutral" x="175" y="632" width="100" height="27" rx="4"/>
  <rect class="base" x="325" y="632" width="100" height="27" rx="4"/>
  <rect class="added" x="475" y="632" width="100" height="27" rx="4"/>
  <rect class="neutral" x="175" y="677" width="100" height="27" rx="4"/>
  <rect class="neutral" x="325" y="677" width="100" height="27" rx="4"/>
  <rect class="neutral" x="475" y="677" width="100" height="27" rx="4"/>
  <rect class="selected" x="317" y="580" width="266" height="87" rx="7"/>

  <text class="time" x="687" y="574" text-anchor="middle">SELECTED</text>
  <text class="body" x="687" y="597" text-anchor="middle">fields + rows</text>
  <path class="flow" d="M590 630 H785"/>

  <rect class="panel" x="800" y="525" width="320" height="165" rx="6"/>
  <text class="field" x="910" y="555" text-anchor="middle">responses</text>
  <text class="field" x="1040" y="555" text-anchor="middle">old_log_probs</text>
  <line class="divider" x1="820" y1="566" x2="1100" y2="566"/>
  <text class="body" x="815" y="603">row 1</text>
  <text class="body" x="815" y="655">row 2</text>
  <rect class="base" x="865" y="581" width="90" height="30" rx="4"/>
  <rect class="added" x="995" y="581" width="90" height="30" rx="4"/>
  <rect class="base" x="865" y="633" width="90" height="30" rx="4"/>
  <rect class="added" x="995" y="633" width="90" height="30" rx="4"/>
</svg>
